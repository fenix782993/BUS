services:

  - type: web
    name: fenix-city
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: DATABASE_URL
        sync: false


  - type: worker
    name: fenix-city-bot
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python -m bot.main

    envVars:

      - key: BOT_TOKEN
        sync: false

      - key: MINI_APP_URL
        sync: false